    <meta charset="utf-8" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#035F5C" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>WOFF Data Centralization &amp; Write-off Capturing</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
    <script type="text/javascript">
      window.addEventListener("beforeunload", (event) => {
        window.localStorage.isMySessionActive = "true";
      });
      // "unload" is blocked by Chrome's permissions policy here, so the open-tab
      // counter is decremented on "pagehide" instead (the only handler for it).
      window.addEventListener("pagehide", function () {
        const newTabCount = localStorage.getItem("tabsOpen");
        if (newTabCount !== null) {
          localStorage.setItem("tabsOpen", newTabCount - 1);
        }
      });
    </script>
  </body>
</html>
